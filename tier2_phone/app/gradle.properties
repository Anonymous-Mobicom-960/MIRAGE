# MIRAGE Tier-2 NPU app - Gradle/AndroidX config.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Feature flag: WHICH ONNX Runtime artifact to bundle.
# 🔴 The code is NOT identical either way. false resolves onnxruntime-android 1.22.0, which
# lacks the EP-registration API OrtRunner calls, and the build FAILS. Build with
# -Pmirage.enableOrt=true (INSTALL.md). The default is left false only so the dependency swap
# stays an explicit, reviewable decision rather than an implicit one.
#   false (default) -> onnxruntime-android (CPU + NNAPI EPs, ~49 MB APK with the bundled model).
#   true            -> onnxruntime-android-qnn (adds the Hexagon HTP backend .so's, ~140 MB APK).
#                      Override per-build:  ./gradlew :app:assembleDebug "-Pmirage.enableOrt=true"
#                      (quote the -P argument in PowerShell).
mirage.enableOrt=false
